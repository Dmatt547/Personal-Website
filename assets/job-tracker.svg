      <rect x="8" y="60" width="78" height="26" rx="6" fill="#ffffff" stroke="#e7e9ee"/>
      <rect x="14" y="70" width="56" height="6" rx="3" fill="#c9ced6"/>
      <rect x="8" y="92" width="78" height="26" rx="6" fill="#ffffff" stroke="#e7e9ee"/>
      <rect x="14" y="102" width="38" height="6" rx="3" fill="#c9ced6"/>

