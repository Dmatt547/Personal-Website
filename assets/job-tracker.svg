      <rect x="118" y="38" width="50" height="6" rx="3" fill="#c9ced6"/>
      <rect x="112" y="60" width="78" height="26" rx="6" fill="#ffffff" stroke="#c9a9e6" stroke-dasharray="4 3"/>
